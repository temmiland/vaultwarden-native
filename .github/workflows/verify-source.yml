name: Verify source learning project
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-policy:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: bash Scripts/test-tool-downloads.sh
      - run: bash Scripts/swiftformat.sh --lint
      - run: swift Scripts/check-architecture.swift
      - run: bash Scripts/test-architecture-rules.sh
      - run: swift Scripts/check-source-secrets.swift
      - run: swift Scripts/check-source-secrets.swift --history
      - run: bash Scripts/test-source-secrets.sh
      - run: swift Scripts/check-source-materials.swift
      - run: bash Scripts/test-integration-preflight.sh
  unsigned-builds-and-tests:
    runs-on: macos-15
    timeout-minutes: 180
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      TMPDIR: /private/tmp
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Toolchain inventory
        run: |
          xcodebuild -version
          swift --version
          rustup --version
      - name: Verified pinned XcodeGen
        run: bash Scripts/xcodegen.sh --version
      - name: Build pinned SDK in isolated scratch clone
        run: bash Scripts/build-sdk.sh --install
      - name: Package tests and SDK smoke
        timeout-minutes: 5
        run: bash Scripts/test-packages.sh
      # Keep platform integration separate from package tests so a stall is attributable.
      - name: Integrated acceptance without server
        timeout-minutes: 60
        run: bash Scripts/test-integration.sh --skip-package-tests
      - name: Unsigned app and extension Debug builds
        run: bash Scripts/build-unsigned.sh
      - name: Synthetic positive/negative contributor configuration checks
        run: bash Scripts/test-configuration.sh
      - name: Unsigned Release macOS
        run: xcodebuild -project Vaultwarden.xcodeproj -scheme VaultwardenMac -configuration Release -destination 'generic/platform=macOS' -derivedDataPath .build/ci-release-macos CODE_SIGNING_ALLOWED=NO build -quiet
      - name: Unsigned Release iOS
        run: xcodebuild -project Vaultwarden.xcodeproj -scheme VaultwardenIOS -configuration Release -destination 'generic/platform=iOS Simulator' -derivedDataPath .build/ci-release-ios CODE_SIGNING_ALLOWED=NO build -quiet
# No signing secrets, server account, artifact upload, automatic tag/release or shared SDK cache.
# A workflow file is not a passed CI run; first fresh-clone build/license inventory remains a gate.
